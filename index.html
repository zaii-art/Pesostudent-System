<div id="v"></div><nav id="nav"></nav><div id="intro"></div>
<script>
const K='pesostudent';
let S={budget:0,pct:0,dlim:0,slog:[],lo:'save',carry:0,ws:'',exp:[],lim:{},sav:0,goal:0,hist:[],cls:[],tasks:[],funds:[],pays:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const P=n=>{const r=Math.round(n*100)/100;return(r<0?'−':'')+'₱'+Math.abs(r).toLocaleString('en-PH',{maximumFractionDigits:2})};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=new Date();T.setHours(0,0,0,0);const tod=iso(T);
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x)};
const OK=/^\d{4}-\d\d-\d\d$/;if(!OK.test(S.ws))S.ws=mon(T);S.exp.forEach(e=>{if(!OK.test(e.date))e.date=tod});if(S.ws>tod)S.ws=tod;
const di=a=>Math.round((new Date(a+'T00:00')-T)/864e5);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V=i=>document.getElementById(i).value.trim();
const N=i=>Math.max(0,parseFloat(V(i))||0),NEG=i=>(parseFloat(V(i))||0)<0;
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const CATS=['Food','Transport','School','Project','Fund','Other'],CI={Food:'🍜',Transport:'🚌',School:'📚',Project:'🧪',Fund:'🎓',Other:'🛍️'},IC={today:'🏠',money:'💸',cls:'🏫',tasks:'📝',funds:'🎓'};
const cd=a=>{const d=di(a);return d<0?'overdue '+(-d)+'d':d==0?'today':d==1?'tomorrow':'in '+d+' days'};
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,Math.max(0,p))}%;background:var(--${c})"></i></div>`;
const paid=f=>S.pays.filter(p=>p.f==f.id).reduce((s,p)=>s+p.a,0);
const rem=f=>Math.max(0,f.amt-paid(f));
const share=f=>{const d=di(f.due);return rem(f)/(d<=0?1:Math.ceil(d/7))};
function calc(){
 const a=S.budget*S.pct/100,sp=S.budget-a+S.carry;
 const ex=S.exp.filter(e=>e.date>=S.ws),spent=ex.reduce((s,e)=>s+e.amt,0),bal=sp-spent;
 const aside=S.funds.reduce((s,f)=>s+share(f),0),safe=bal-aside;
 const el=Math.max(0,-di(S.ws)),dl=Math.max(1,7-el);
 const bc={};ex.forEach(e=>bc[e.cat]=(bc[e.cat]||0)+e.amt);
 const td=ex.filter(e=>e.date==tod).reduce((s,e)=>s+e.amt,0);const allow=S.dlim>0?S.dlim:Math.max(0,bal+td-aside)/dl,left=allow-td;return{a,sp,ex,spent,bal,aside,safe,el,dl,td,allow,left,day:left,bc}}
const ns=c=>{let n=0;for(let i=0;i<=Math.min(c.el,6);i++){const x=new Date(S.ws+'T00:00');x.setDate(x.getDate()+i);if(!S.exp.some(e=>e.date==iso(x)))n++}return n};
const pri=t=>t.pri&&t.pri!='Auto'?t.pri:(t.type=='Assignment'?'Medium':'High');
const st=t=>t.done?'Done':new Date()>endTs(t)?'Overdue':new Date()>=startTs(t)?(EV(t)?'Happening now':'In progress'):'Upcoming';
function alerts(c,x){
 const a=[];
